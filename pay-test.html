<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>为准企服支付测试</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Microsoft YaHei", sans-serif;
      margin: 0;
      padding: 40px 24px;
      background: #fff;
      color: #111;
    }

    .box {
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      font-size: 36px;
      margin-top: 60px;
      margin-bottom: 18px;
    }

    p {
      font-size: 18px;
      color: #555;
      margin-bottom: 40px;
    }

    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 15px 20px;
      border-radius: 8px;
      border: 0;
      background: #b5121b;
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-size: 18px;
      font-weight: 600;
    }

    .note {
      margin-top: 20px;
      font-size: 14px;
      color: #999;
      line-height: 1.7;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>为准企服</h1>
    <p>微信授权与支付测试页</p>

    <a class="btn"
       href="/.netlify/functions/oauth-start">
      开始微信授权测试
    </a>

    <div class="note">
      本页面仅用于微信网页授权测试，
      当前不会产生任何支付或扣款。
    </div>
  </div>
</body>
</html>
